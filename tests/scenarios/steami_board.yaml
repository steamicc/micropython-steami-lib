  - name: "Buttons take EXTI line 0 for MENU, not for INT_EXPANDER"
    action: hardware_script
    script: |
      import os, sys
      for d in os.listdir('/remote'):
        sys.path.insert(0, '/remote/' + d)
      from machine import Pin
      from steami import Steami, Buttons
      Steami.begin()
      Buttons().begin()
      try:
        Pin("INT_EXPANDER", Pin.IN).irq(lambda pin: None, Pin.IRQ_FALLING)
        result = False
      except OSError as exc:
        print("refused:", exc)
        result = True
    expect_true: true
    mode: [hardware]
