type: board
name: "steami_board"

# V1c only: the hardware tests are skipped on a V1a or V1b.
releases: [V1c]

# Hardware-only checks of the `steami` package on a STeaMi V1c.
# Needs the board in V1c state with no button pressed.
# Each test starts from a fresh interpreter, so the `Steami` state does not
# leak from one test to the next.
#
# Run with a terminal (hardware_script tests are skipped without one):
#   python -m pytest tests/ -v -k steami_board --port /dev/ttyACM0 -s

# Mounts lib/ on the board so that lib/steami and the new lib/daplink_bridge
# (has_config_zone) are used instead of the frozen ones. Every driver folder
# of lib/ goes on sys.path: a bare /remote/mcp23009e folder (the repository
# layout) would otherwise hide the frozen package of the same name.
drivers:
  - steami
  - daplink_bridge

tests:
  - name: "Steami.begin() detects a V1c"
    action: hardware_script
    script: |
      import os, sys
      for d in os.listdir('/remote'):
        sys.path.insert(0, '/remote/' + d)
      from steami import Steami, Release
      result = Steami.begin() == Release.V1C == "V1c"
    expect_true: true
    mode: [hardware]

  - name: "Steami.schematic_index() is the units digit of the revision"
    action: hardware_script
    script: |
      import os, sys
      for d in os.listdir('/remote'):
        sys.path.insert(0, '/remote/' + d)
      from steami import Steami
      Steami.begin()
      rev = Steami.revision()
      index = Steami.schematic_index()
      print("revision:", rev, "schematic index:", index)
      result = index is None if rev is None else index == rev % 10
    expect_true: true
    mode: [hardware]

  - name: "Temperature uses the BME280"
    action: hardware_script
    script: |
      import os, sys
      for d in os.listdir('/remote'):
        sys.path.insert(0, '/remote/' + d)
      from steami import Steami, Temperature, Chip
      Steami.begin()
      t = Temperature()
      t.begin()
      result = t.chip() == Chip.BME280 == "BME280"
    expect_true: true
    mode: [hardware]

  - name: "Temperature reads between 0 and 50 C"
    action: hardware_script
    script: |
      import os, sys
      for d in os.listdir('/remote'):
        sys.path.insert(0, '/remote/' + d)
      from steami import Steami, Temperature
      Steami.begin()
      value = Temperature().read()
      print("temperature:", value)
      result = 0 <= value <= 50
    expect_true: true
    mode: [hardware]

  - name: "Light is not on this board"
    action: hardware_script
    script: |
      import os, sys
      for d in os.listdir('/remote'):
        sys.path.insert(0, '/remote/' + d)
      from steami import Steami, Light, Status
      Steami.begin()
      light = Light()
      light.begin()
      result = light.status() == Status.NOT_ON_THIS_BOARD
    expect_true: true
    mode: [hardware]

  - name: "Battery voltage is between 3.0 and 4.4 V"
    action: hardware_script
    script: |
      import os, sys
      for d in os.listdir('/remote'):
        sys.path.insert(0, '/remote/' + d)
      from steami import Steami, Battery
      Steami.begin()
      value = Battery().voltage()
      print("voltage:", value)
      result = 3.0 <= value <= 4.4
    expect_true: true
    mode: [hardware]

  - name: "Button A is not pressed"
    action: hardware_script
    script: |
      import os, sys
      for d in os.listdir('/remote'):
        sys.path.insert(0, '/remote/' + d)
      from steami import Steami, Buttons
      Steami.begin()
      result = Buttons().is_pressed("A") is False
    expect_true: true
    mode: [hardware]

  # Quick taps between two calls (issue #497): A, B and MENU through a hard
  # IRQ, the D-pad through the latch of the MCP23009E. The D-pad taps check
  # the release filter (20 ms with no change) against real bounces.

  - name: "Buttons catch quick A taps with a slow loop"
    action: hardware_script
    pre_prompt: "Quand la LED verte s'allume, tapez A 4 fois, très brièvement (moins de 150 ms), environ une fois par seconde. Elle s'éteint au bout de 8 s."
    wait: false
    script: |
      import os, sys
      for d in os.listdir('/remote'):
        sys.path.insert(0, '/remote/' + d)
      from machine import Pin
      from time import sleep_ms, ticks_ms, ticks_diff
      from steami import Steami, Buttons
      Steami.begin()
      buttons = Buttons()
      buttons.begin()
      names = ("A", "B", "MENU", "UP", "DOWN", "LEFT", "RIGHT")
      for n in names:
        buttons.was_pressed(n)
        buttons.was_released(n)
      led = Pin("LED_GREEN", Pin.OUT)
      led.on()
      presses = releases = others = 0
      t0 = ticks_ms()
      while ticks_diff(ticks_ms(), t0) < 8000:
        sleep_ms(300)  # a slow loop: the taps happen between two calls
        for n in names:
          if buttons.was_pressed(n):
            if n == "A":
              presses += 1
            else:
              others += 1
        if buttons.was_released("A"):
          releases += 1
      sleep_ms(300)
      if buttons.was_released("A"):
        releases += 1
      led.off()
      print("presses:", presses, "releases:", releases, "others:", others)
      result = presses == 4 and releases == 4 and others == 0
    expect_true: true
    mode: [hardware]

