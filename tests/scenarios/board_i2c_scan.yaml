type: board
name: "board_i2c_scan"

# Devices of the internal I2C bus (I2C1, 7-bit addresses), per release
# (lib/steami/steami/const.py and the wiki page "Capteurs et bus internes"):
#   all releases: 0x1E=LIS2MDL, 0x20=MCP23009E, 0x29=VL53L1X,
#                 0x3B=STM32F103CB (DAPLink bridge), 0x6B=ISM330DL,
#                 0x55=BQ27441 (only present when a battery is connected)
#   V1a/V1b only: 0x39=APDS9960, 0x5D=WSEN-PADS, 0x5F=WSEN-HIDS
#   V1c only:     0x76=BME280
# The tests limited by `releases` are skipped on the other releases.

tests:
  - name: "I2C bus scan finds expected devices (V1a/V1b)"
    releases: [V1a, V1b]
    action: hardware_script
    script: |
      from machine import I2C, Pin
      # Release MCP23009E from reset so it responds to scan
      rst = Pin("RST_EXPANDER", Pin.OUT)
      rst.on()
      from time import sleep_ms
      sleep_ms(10)
      i2c = I2C(1)
      found = i2c.scan()
      # 0x55=BQ27441 excluded (only present when battery connected)
      expected = [0x1E, 0x20, 0x29, 0x39, 0x3B, 0x5D, 0x5F, 0x6B]
      missing = sorted([hex(a) for a in expected if a not in found])
      result = missing
    expect: []
    mode: [hardware]

  - name: "No unexpected I2C devices (V1a/V1b)"
    releases: [V1a, V1b]
    action: hardware_script
    script: |
      from machine import I2C, Pin
      rst = Pin("RST_EXPANDER", Pin.OUT)
      rst.on()
      from time import sleep_ms
      sleep_ms(10)
      i2c = I2C(1)
      found = i2c.scan()
      known = [0x1E, 0x20, 0x29, 0x39, 0x3B, 0x55, 0x5D, 0x5F, 0x6B]
      unexpected = sorted([hex(a) for a in found if a not in known])
      result = unexpected
    expect: []
    mode: [hardware]

  - name: "I2C bus scan finds expected devices (V1c)"
    releases: [V1c]
    action: hardware_script
    script: |
      from machine import I2C, Pin
      # Release MCP23009E from reset so it responds to scan
      rst = Pin("RST_EXPANDER", Pin.OUT)
      rst.on()
      from time import sleep_ms
      sleep_ms(10)
      i2c = I2C(1)
      found = i2c.scan()
      # 0x55=BQ27441 excluded (only present when battery connected)
      expected = [0x1E, 0x20, 0x29, 0x3B, 0x6B, 0x76]
      missing = sorted([hex(a) for a in expected if a not in found])
      result = missing
    expect: []
    mode: [hardware]

  - name: "No unexpected I2C devices (V1c)"
    releases: [V1c]
    action: hardware_script
    script: |
      from machine import I2C, Pin
      rst = Pin("RST_EXPANDER", Pin.OUT)
      rst.on()
      from time import sleep_ms
      sleep_ms(10)
      i2c = I2C(1)
      found = i2c.scan()
      known = [0x1E, 0x20, 0x29, 0x3B, 0x55, 0x6B, 0x76]
      unexpected = sorted([hex(a) for a in found if a not in known])
      result = unexpected
    expect: []
    mode: [hardware]

  # --- WHO_AM_I / Device ID checks ---
  # Each test reads the identification register of one component.

  - name: "LIS2MDL WHO_AM_I (0x1E)"
    action: hardware_script
    script: |
      from machine import I2C
      i2c = I2C(1)
      result = i2c.readfrom_mem(0x1E, 0x4F, 1)[0]
    expect: 0x40
    mode: [hardware]

  - name: "MCP23009E IODIR default (0x20)"
    action: hardware_script
    script: |
      from machine import I2C, Pin
      rst = Pin("RST_EXPANDER", Pin.OUT)
      rst.on()
      from time import sleep_ms
      sleep_ms(10)
      i2c = I2C(1)
      # IODIR register default value after reset = 0xFF (all inputs)
      result = i2c.readfrom_mem(0x20, 0x00, 1)[0]
    expect: 0xFF
    mode: [hardware]

  - name: "VL53L1X model ID (0x29)"
    action: hardware_script
    script: |
      from machine import I2C
      i2c = I2C(1)
      data = i2c.readfrom_mem(0x29, 0x010F, 2, addrsize=16)
      result = (data[0] << 8) | data[1]
    expect: 0xEACC
    mode: [hardware]

  - name: "APDS9960 device ID (0x39)"
    releases: [V1a, V1b]
    action: hardware_script
    script: |
      from machine import I2C
      i2c = I2C(1)
      result = i2c.readfrom_mem(0x39, 0x92, 1)[0]
    expect: 0xAB
    mode: [hardware]

  - name: "WSEN-PADS device ID (0x5D)"
    releases: [V1a, V1b]
    action: hardware_script
    script: |
      from machine import I2C
      i2c = I2C(1)
      result = i2c.readfrom_mem(0x5D, 0x0F, 1)[0]
    expect: 0xB3
    mode: [hardware]

  - name: "HTS221/WSEN-HIDS device ID (0x5F)"
    releases: [V1a, V1b]
    action: hardware_script
    script: |
      from machine import I2C
      i2c = I2C(1)
      result = i2c.readfrom_mem(0x5F, 0x0F, 1)[0]
    expect: 0xBC
    mode: [hardware]

  - name: "ISM330DL WHO_AM_I (0x6B)"
    action: hardware_script
    script: |
      from machine import I2C
      i2c = I2C(1)
      result = i2c.readfrom_mem(0x6B, 0x0F, 1)[0]
    expect: 0x6A
    mode: [hardware]

  - name: "BME280 chip ID (0x76)"
    releases: [V1c]
    action: hardware_script
    script: |
      from machine import I2C
      i2c = I2C(1)
      result = i2c.readfrom_mem(0x76, 0xD0, 1)[0]
    expect: 0x60
    mode: [hardware]
