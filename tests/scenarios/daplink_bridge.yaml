driver: daplink_bridge
driver_class: DaplinkBridge
i2c_address: 0x3B

i2c:
  id: 1

mock_registers:
  # WHO_AM_I (expected 0x4C)
  0x01: 0x4C
  # STATUS_REG (not busy)
  0x80: 0x00
  # ERROR_REG (no error)
  0x81: 0x00

tests:
  - name: "Verify WHO_AM_I register"
    action: read_register
    register: 0x01
    expect: 0x4C
    mode: [mock, hardware]

  - name: "Read WHO_AM_I via method"
    action: call
    method: device_id
    expect: 0x4C
    mode: [mock, hardware]

  - name: "Read status register"
    action: call
    method: _status
    expect: 0x00
    mode: [mock]

  - name: "Read error register"
    action: call
    method: _error
    expect: 0x00
    mode: [mock]

  - name: "Not busy when status is 0"
    action: script
    script: |
      result = dev.busy() == False
    expect_true: true
    mode: [mock]

  - name: "Clear config sends command"
    action: script
    script: |
      i2c.clear_write_log()
      dev.clear_config()
      log = i2c.get_write_log()
      sent_clear = any(reg is None and 0x32 in data for reg, data in log)
      result = sent_clear
    expect_true: true
    mode: [mock]

  - name: "Write config sends command"
    action: script
    script: |
      i2c.clear_write_log()
      dev.write_config(b"test")
      log = i2c.get_write_log()
      sent_write = any(reg is None and data[0] == 0x30 for reg, data in log)
      result = sent_write
    expect_true: true
    mode: [mock]

  - name: "Write config sends write without prior clear"
    action: script
    script: |
      i2c.clear_write_log()
      dev.write_config(b"hi")
      log = i2c.get_write_log()
      sent_clear = any(reg is None and 0x32 in data for reg, data in log)
      sent_write = any(reg is None and data[0] == 0x30 for reg, data in log)
      result = sent_write and not sent_clear
    expect_true: true
    mode: [mock]

  - name: "Config zone present"
    action: script
    script: |
      i2c.clear_write_log()
      result = dev.has_config_zone() is True and (0x20, b"\x00\x00") in i2c.get_write_log()
    expect_true: true
    mode: [mock]

  - name: "Config zone absent (old firmware)"
    action: script
    script: |
      i2c.set_register_sequence(0x81, [b"\x00", b"\x80"])
      result = dev.has_config_zone() is False
    expect_true: true
    mode: [mock]

  - name: "Bridge still busy is not cached"
    action: script
    script: |
      # Idle before the probe, then busy at every later read.
      i2c._registers[0x80] = b"\x80"
      i2c.clear_write_log()
      i2c.set_register_sequence(0x80, [b"\x00"])
      first = dev.has_config_zone()
      i2c.set_register_sequence(0x80, [b"\x00"])
      second = dev.has_config_zone()
      probes = [e for e in i2c.get_write_log() if e[0] == 0x20]
      result = first is False and second is False and len(probes) == 2
    expect_true: true
    mode: [mock]

  - name: "Config zone result cached"
    action: script
    script: |
      first = dev.has_config_zone()
      i2c.clear_write_log()
      second = dev.has_config_zone()
      result = first is True and second is True and i2c.get_write_log() == []
    expect_true: true
    mode: [mock]

  # ----- Hardware -----

  - name: "Status register readable"
    action: call
    method: _status
    expect_not_none: true
    mode: [hardware]

  - name: "Error register readable"
    action: call
    method: _error
    expect_not_none: true
    mode: [hardware]

  - name: "Write and read config round-trip"
    action: hardware_script
    script: |
      dev.clear_config()
      dev.write_config('{"test": 42}')
      content = dev.read_config()
      result = content == b'{"test": 42}'
    expect_true: true
    mode: [hardware]

  - name: "Clear config erases config zone"
    action: hardware_script
    script: |
      dev.write_config("data")
      dev.clear_config()
      result = dev.read_config() == b""
    expect_true: true
    mode: [hardware]
