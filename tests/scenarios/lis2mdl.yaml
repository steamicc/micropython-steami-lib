driver: lis2mdl
driver_class: LIS2MDL
i2c_address: 0x1E

# I2C config for hardware tests (STeaMi board - STM32WB55)
i2c:
  id: 1

# Register values for mock tests
# These simulate a real LIS2MDL magnetometer
mock_registers:
  # WHO_AM_I (expected 0x40)
  0x4F: 0x40
  # CFG_REG_A (continuous mode, 10Hz, temp comp on)
  0x60: 0x80
  # CFG_REG_B (default)
  0x61: 0x00
  # CFG_REG_C (BDU enabled)
  0x62: 0x10
  # STATUS_REG (new data ready on all axes)
  0x67: 0x0F
  # OUTX_L..OUTZ_H (simulated magnetic field ~300, -150, 450 LSB)
  # Multi-byte read at 0xE8 (0x68 | 0x80), 6 bytes block
  0xE8: [0x2C, 0x01, 0x6A, 0xFF, 0xC2, 0x01]
  # TEMP_OUT (simulated ~25°C: offset=25, raw=0 → 25+0/8=25°C)
  0x6E: 0x00  # TEMP_OUT_L
  0x6F: 0x00  # TEMP_OUT_H
  # Offset registers (all zero)
  0x45: 0x00
  0x46: 0x00
  0x47: 0x00
  0x48: 0x00
  0x49: 0x00
  0x4A: 0x00

tests:
  - name: "Verify WHO_AM_I register"
    action: read_register
    register: 0x4F
    expect: 0x40
    mode: [mock, hardware]

  - name: "Read WHO_AM_I via method"
    action: call
    method: device_id
    expect: 0x40
    mode: [mock, hardware]

  - name: "Read status register"
    action: call
    method: _status
    expect_not_none: true
    mode: [mock, hardware]

  - name: "Read magnetic field returns tuple"
    action: call
    method: magnetic_field
    expect_not_none: true
    mode: [mock]

  - name: "Read magnetic field in uT returns tuple"
    action: call
    method: magnetic_field_ut
    expect_not_none: true
    mode: [mock]

  - name: "Read temperature returns float"
    action: call
    method: temperature
    expect: 25.0
    mode: [mock]

  - name: "Temperature with offset"
    action: script
    script: |
      dev.set_temp_offset(-2.0)
      result = dev.temperature()
    expect_range: [22.0, 24.0]
    mode: [mock]

  - name: "Temperature with two-point calibration"
    action: script
    script: |
      dev.calibrate_temperature(20.0, 25.0, 30.0, 35.0)
      result = dev.temperature()
    expect_range: [19.0, 21.0]
    mode: [mock]

  # ----- Continuous / one-shot -----

  - name: "set_continuous writes CFG_REG_A"
    action: script
    script: |
      i2c.clear_write_log()
      dev.set_continuous(10)
      log = i2c.get_write_log()
      wrote_cfg = any(reg == 0x60 for reg, data in log)
      result = wrote_cfg
    expect_true: true
    mode: [mock]

  - name: "trigger_one_shot sets single mode"
    action: script
    script: |
      dev.trigger_one_shot()
      mode = dev.get_mode()
      result = mode == "single"
    expect_true: true
    mode: [mock]

  - name: "read_one_shot returns tuple of 3 ints"
    action: script
    script: |
      x, y, z = dev.read_one_shot()
      result = isinstance(x, int) and isinstance(y, int) and isinstance(z, int)
    expect_true: true
    mode: [mock]

  # ----- Auto-trigger -----

  - name: "Magnetic field readable after power down"
    action: script
    script: |
      dev.power_off()
      x, y, z = dev.magnetic_field()
      result = isinstance(x, int) and isinstance(y, int) and isinstance(z, int)
    expect_true: true
    mode: [mock]

  - name: "Temperature readable after power down"
    action: script
    script: |
      dev.power_off()
      t = dev.temperature()
      result = isinstance(t, float)
    expect_true: true
    mode: [mock]

  - name: "Auto-trigger writes single mode to CFG_REG_A"
    action: script
    script: |
      dev.power_off()
      i2c.clear_write_log()
      dev.magnetic_field()
      log = i2c.get_write_log()
      wrote_cfg_a = any(reg == 0x60 for reg, data in log)
      result = wrote_cfg_a
    expect_true: true
    mode: [mock]

  - name: "No auto-trigger when already active"
    action: script
    script: |
      dev.magnetic_field()
      i2c.clear_write_log()
      dev.magnetic_field()
      log = i2c.get_write_log()
      result = len(log) == 0
    expect_true: true
    mode: [mock]

  # ----- Calibration -----

  - name: "set_heading_offset stores offset"
    action: script
    script: |
      dev.set_heading_offset(45.0)
      result = dev._heading_offset_deg == 45.0
    expect_true: true
    mode: [mock]

  - name: "set_declination stores declination"
    action: script
    script: |
      dev.set_declination(-3.5)
      result = dev._declination_deg == -3.5
    expect_true: true
    mode: [mock]

  - name: "set_hw_offsets writes to offset registers"
    action: script
    script: |
      i2c.clear_write_log()
      dev.set_hw_offsets(100, -200, 300)
      log = i2c.get_write_log()
      # Should write to OFFSET_X (0x45), OFFSET_Y (0x47), OFFSET_Z (0x49)
      regs = [reg for reg, data in log if reg is not None]
      result = 0x45 in regs and 0x47 in regs and 0x49 in regs
    expect_true: true
    mode: [mock]

  - name: "read_hw_offsets returns zeros from mock registers"
    action: script
    script: |
      ox, oy, oz = dev.read_hw_offsets()
      # Mock registers initialize all offset bytes to 0x00
      result = (ox, oy, oz) == (0, 0, 0)
    expect_true: true
    mode: [mock]

  - name: "calibrated_field applies offset and scale"
    action: script
    script: |
      dev.x_off = 100.0
      dev.y_off = -50.0
      dev.z_off = 0.0
      dev.x_scale = 2.0
      dev.y_scale = 1.0
      dev.z_scale = 1.0
      x, y, z = dev.calibrated_field()
      # Raw is (300, -150, 450), after calibration:
      # x = (300 - 100) / 2.0 = 100.0
      # y = (-150 - (-50)) / 1.0 = -100.0
      # z = (450 - 0) / 1.0 = 450.0
      result = x == 100.0 and y == -100.0 and z == 450.0
    expect_true: true
    mode: [mock]

  - name: "calibrate_reset restores defaults"
    action: script
    script: |
      dev.x_off = 999
      dev.y_off = 999
      dev.calibrate_reset()
      result = dev.x_off == 0 and dev.y_off == 0 and dev.x_scale == 1.0 and dev.y_scale == 1.0
    expect_true: true
    mode: [mock]

  - name: "read_calibration returns current values"
    action: script
    script: |
      dev.x_off = 10
      dev.y_off = 20
      dev.z_off = 30
      dev.x_scale = 1.1
      dev.y_scale = 1.2
      dev.z_scale = 1.3
      cal = dev.read_calibration()
      result = cal == (10, 20, 30, 1.1, 1.2, 1.3)
    expect_true: true
    mode: [mock]

  - name: "calibrate_minmax with samples=0 raises ValueError and keeps calibration"
    action: script
    script: |
      dev.set_calibrate_step(10, 20, 30, 2.0, 3.0, 4.0)
      raised = 0
      for calibrate in (dev.calibrate_minmax_2d, dev.calibrate_minmax_3d):
          try:
              calibrate(samples=0, delay_ms=0)
          except ValueError:
              raised += 1
      result = raised == 2 and dev.read_calibration() == (10, 20, 30, 2.0, 3.0, 4.0)
    expect_true: true
    mode: [mock]

  - name: "calibrate_minmax keeps calibration when a sample read fails"
    action: script
    script: |
      dev.set_calibrate_step(10, 20, 30, 2.0, 3.0, 4.0)
      reads = []
      def flaky_field():
          reads.append(1)
          if len(reads) % 2 == 0:
              raise OSError("bus error")
          return (400, -300, 200)
      dev.magnetic_field = flaky_field
      raised = 0
      for calibrate in (dev.calibrate_minmax_2d, dev.calibrate_minmax_3d):
          try:
              calibrate(samples=5, delay_ms=0)
          except OSError:
              raised += 1
      del dev.magnetic_field
      result = raised == 2 and dev.read_calibration() == (10, 20, 30, 2.0, 3.0, 4.0)
    expect_true: true
    mode: [mock]

  - name: "calibrate_minmax_3d uses every sample"
    action: script
    script: |
      fields = [(100, -50, 10), (300, 150, -30), (200, 50, 90)]
      dev.magnetic_field = lambda: fields.pop(0)
      dev.calibrate_minmax_3d(samples=3, delay_ms=0)
      del dev.magnetic_field
      result = dev.read_calibration() == (200, 50, 30, 100, 100, 60)
    expect_true: true
    mode: [mock]

  # ----- Heading -----

  - name: "heading_flat_only returns angle 0-360"
    action: script
    script: |
      dev.calibrate_reset()
      h = dev.heading_flat_only()
      result = 0 <= h < 360
    expect_true: true
    mode: [mock]

  - name: "heading_with_tilt_compensation equals the flat heading when flat"
    action: script
    script: |
      import math
      dev.calibrate_reset()
      dev.set_heading_offset(0)
      dev.set_declination(0)
      dev.set_heading_filter(0)
      # Screen up and flat, the ISM330DL reads about (0, 0, -1) g: same atan2 as the flat path
      ok = dev.heading_with_tilt_compensation(lambda: (0.0, 0.0, -1.0)) == dev.heading_flat_only()
      for k in range(72):
          t = math.radians(5 * k + 0.3)
          x, y, z = -400 * math.sin(t), 400 * math.cos(t), 300 - 9 * k
          flat = dev.heading_from_vectors(x, y, z)
          for g in (-1.0, -0.97, -1.04):
              ok = ok and dev.heading_from_vectors_tilt(x, y, z, 0.0, 0.0, g) == flat
      result = ok
    expect_true: true
    mode: [mock]

  - name: "heading_from_vectors_tilt gives back the heading of a tilted board"
    action: script
    script: |
      import math
      dev.calibrate_reset()
      dev.set_heading_offset(0)
      dev.set_declination(0)
      dev.set_heading_filter(0)
      s = dev._MAG_Z_SIGN
      dip = math.radians(60)
      field = (0.0, 40 * math.cos(dip), -40 * math.sin(dip))  # world (east, north, up)
      def rot(v, k, a):
          # Rotation of v by a around the unit axis k (Rodrigues)
          c, sn = math.cos(a), math.sin(a)
          d = sum(v[i] * k[i] for i in range(3))
          w = (k[1] * v[2] - k[2] * v[1], k[2] * v[0] - k[0] * v[2], k[0] * v[1] - k[1] * v[0])
          return tuple(v[i] * c + w[i] * sn + k[i] * d * (1 - c) for i in range(3))
      def dot(a, b):
          return sum(a[i] * b[i] for i in range(3))
      worst = 0.0
      for heading in range(0, 360, 15):
          h = math.radians(heading)
          # Flat board: T (top of the screen) to the heading, R to its right, U up
          t_ax, r_ax, u_ax = (math.sin(h), math.cos(h), 0.0), (math.cos(h), -math.sin(h), 0.0), (0, 0, 1)
          for pitch in range(-45, 46, 15):
              p = math.radians(pitch)  # raises the top of the screen
              t1, u1 = rot(t_ax, r_ax, p), rot(u_ax, r_ax, p)
              for roll in range(-45, 46, 15):
                  r = math.radians(roll)  # raises the right edge
                  r2, u2 = rot(r_ax, t1, -r), rot(u1, t1, -r)
                  x, y, z = dot(field, r2), dot(field, t1), s * dot(field, u2)
                  # ISM330DL: X = -T, Y = -R, Z = -U; at rest it reads the up vector
                  ax, ay, az = -t1[2], -r2[2], -u2[2]
                  got = dev.heading_from_vectors_tilt(x, y, z, ax, ay, az)
                  err = abs((got - heading + 180) % 360 - 180)
                  worst = max(worst, err)
                  ok_range = 0 <= got < 360
                  if not ok_range:
                      worst = 999
      result = worst < 0.01
    expect_true: true
    mode: [mock]

  - name: "tilt heading uses the magnetometer Z sign"
    action: script
    script: |
      import math
      dev.calibrate_reset()
      dev.set_heading_offset(0)
      dev.set_declination(0)
      dev.set_heading_filter(0)
      s = dev._MAG_Z_SIGN
      r = math.radians(20)  # right edge raised by 20 degrees, pointing north
      h, v = 0.5, math.sqrt(3) / 2  # dip 60 degrees
      x, y, z = -v * math.sin(r), h, s * -v * math.cos(r)
      ax, ay, az = 0.0, -math.sin(r), -math.cos(r)
      good = dev.heading_from_vectors_tilt(x, y, z, ax, ay, az)
      wrong = dev.heading_from_vectors_tilt(x, y, -z, ax, ay, az)
      flat = dev.heading_from_vectors(x, y, z)
      result = (min(good, 360 - good) < 0.01 and min(wrong, 360 - wrong) > 10
                and 25 < flat < 35 and s in (1, -1))
    expect_true: true
    mode: [mock]

  - name: "heading_with_tilt_compensation reads the field and the accelerometer"
    action: script
    script: |
      import math
      dev.calibrate_reset()
      dev.set_heading_offset(0)
      dev.set_declination(0)
      dev.set_heading_filter(0)
      t = math.radians(20)  # top of the screen raised by 20 degrees, pointing east
      h, v = 0.5, math.sqrt(3) / 2
      s = dev._MAG_Z_SIGN
      dev.magnetic_field = lambda: (-h, -v * math.sin(t), s * -v * math.cos(t))
      got = dev.heading_with_tilt_compensation(lambda: (-math.sin(t), 0.0, -math.cos(t)))
      flat = dev.heading_flat_only()
      del dev.magnetic_field
      result = abs(got - 90) < 0.01 and abs(flat - 90) > 10
    expect_true: true
    mode: [mock]

  - name: "tilt heading applies the calibration, the offsets and the filter"
    action: script
    script: |
      dev.calibrate_reset()
      dev.set_heading_filter(0)
      dev.set_calibrate_step(10, -20, 30, 2.0, 3.0, 4.0)
      dev.set_heading_offset(12)
      dev.set_declination(-2)
      ok = True
      for x, y, z in ((110, -20, 0), (10, 280, 500), (-190, -320, -70)):
          ok = ok and dev.heading_from_vectors_tilt(x, y, z, 0, 0, -1) == dev.heading_from_vectors(x, y, z)
      raw = dev.heading_from_vectors_tilt(110, -20, 30, 0, 0, -1, calibrated=False)
      ok = ok and raw == dev.heading_from_vectors(110, -20, 30, calibrated=False)
      dev.set_heading_filter(0.5)
      a = dev.heading_from_vectors_tilt(10, 100, 30, 0, 0, -1)
      b = dev.heading_from_vectors_tilt(-90, -20, 30, 0, 0, -1)
      dev.set_heading_filter(0)
      dev.calibrate_reset()
      dev.set_heading_offset(0)
      dev.set_declination(0)
      result = ok and abs(a - 10) < 1e-6 and 10 < b < 100
    expect_true: true
    mode: [mock]

  - name: "tilt heading is nan without gravity and in [0, 360) screen down"
    action: script
    script: |
      import math
      dev.calibrate_reset()
      dev.set_heading_filter(0)
      nan = float("nan")
      zero = dev.heading_from_vectors_tilt(300, -150, 450, 0.0, 0.0, 0.0)
      bad = dev.heading_from_vectors_tilt(300, -150, 450, nan, nan, nan)
      down = dev.heading_with_tilt_compensation(lambda: (0.0, 0.0, 1.0))
      result = math.isnan(zero) and math.isnan(bad) and 0 <= down < 360
    expect_true: true
    mode: [mock]

  - name: "tilt heading matches the V1c measurement of 2026-11-28"
    action: script
    script: |
      # Rows of the V1c log of MPY#344: m = calibrated LIS2MDL field, a = ISM330DL
      # acceleration in g, then the logged flat heading and tilt heading (s = -1).
      dev.calibrate_reset()  # identity calibration: m is already calibrated
      dev.set_heading_offset(0)
      dev.set_declination(0)
      dev.set_heading_filter(0)
      rows = (
          ("flat, north ref", (0.039, -0.590, 0.784), (-0.05, -0.00, -1.00), 183.8, 184.1),
          ("flat, north ref", (0.021, -0.609, 0.767), (-0.05, -0.00, -1.00), 181.9, 182.1),
          ("roll, ay > 0", (0.596, -0.625, 0.467), (-0.08, 0.66, -0.74), 223.6, 193.5),
          ("roll, ay < 0", (-0.314, -0.580, 0.747), (-0.02, -0.54, -0.86), 151.6, 193.2),
          ("flat, east", (0.589, 0.104, 0.750), (-0.06, 0.02, -1.00), 280.0, 284.3),
          ("pitch, east", (0.453, 0.464, 0.700), (0.26, -0.10, -0.97), 315.6, 298.3),
      )
      def err(a, b):
          return abs((a - b + 180) % 360 - 180)
      bad = []
      for label, m, a, flat_log, tilt_log in rows:
          tilt = dev.heading_from_vectors_tilt(*m, *a)
          flat = dev.heading_from_vectors(*m)
          wrong = dev.heading_from_vectors_tilt(m[0], m[1], -m[2], *a)  # other Z sign
          if err(tilt, tilt_log) > 0.5 or err(flat, flat_log) > 0.5:
              bad.append(label)
          if label.startswith("flat, north") and err(tilt, flat) > 0.5:
              bad.append(label + " (flat)")
          if label.startswith("roll") and err(wrong, tilt_log) < 30:
              bad.append(label + " (sign)")
      result = bad == []
    expect_true: true
    mode: [mock]

  - name: "tilt heading applies the Z calibration"
    action: script
    script: |
      # The roll row of the V1c log (heading 193.5), fed as raw values through a
      # calibration that is not the identity on any axis, Z included.
      dev.set_heading_offset(0)
      dev.set_declination(0)
      dev.set_heading_filter(0)
      dev.set_calibrate_step(-0.2, 0.3, 0.9, 2.0, 0.5, 3.0)
      m, a = (0.596, -0.625, 0.467), (-0.08, 0.66, -0.74)
      raw = (m[0] * 2.0 - 0.2, m[1] * 0.5 + 0.3, m[2] * 3.0 + 0.9)
      got = dev.heading_from_vectors_tilt(*raw, *a)
      ref = dev.heading_from_vectors_tilt(*m, *a, calibrated=False)
      dev.calibrate_reset()
      result = abs((got - 193.5 + 180) % 360 - 180) < 0.5 and abs(got - ref) < 1e-6
    expect_true: true
    mode: [mock]

  - name: "tilt heading without gravity keeps the heading filter untouched"
    action: script
    script: |
      import math
      dev.calibrate_reset()
      dev.set_heading_offset(0)
      dev.set_declination(0)
      dev.set_heading_filter(0.5)
      nan = float("nan")
      bad_gravity = ((0.0, 0.0, 0.0), (nan, nan, nan), (nan, 0.0, -1.0), (0.0, nan, -1.0))
      ok = True
      for a in bad_gravity:  # filter still empty
          ok = ok and math.isnan(dev.heading_from_vectors_tilt(0, 100, 50, *a))
      ok = ok and dev._hf_cos is None and dev._hf_sin is None
      first = dev.heading_from_vectors_tilt(0, 100, 50, 0.0, 0.0, -1.0)
      state = (dev._hf_cos, dev._hf_sin)
      for a in bad_gravity:  # filter already started
          ok = ok and math.isnan(dev.heading_from_vectors_tilt(-100, 0, 50, *a))
      ok = ok and math.isnan(dev.heading_with_tilt_compensation(lambda: (0.0, 0.0, 0.0)))
      ok = ok and (dev._hf_cos, dev._hf_sin) == state
      dev.set_heading_filter(0)
      result = ok and abs(first) < 1e-6
    expect_true: true
    mode: [mock]

  - name: "heading offset shifts heading"
    action: script
    script: |
      dev.calibrate_reset()
      dev.set_heading_offset(0)
      h1 = dev.heading_flat_only()
      dev.set_heading_offset(90)
      h2 = dev.heading_flat_only()
      # h2 should differ from h1 by ~90 degrees (mod 360)
      diff = abs(h2 - h1)
      if diff > 180:
          diff = 360 - diff
      result = 80 < diff < 100
    expect_true: true
    mode: [mock]

  - name: "declination shifts heading"
    action: script
    script: |
      dev.calibrate_reset()
      dev.set_declination(0)
      h1 = dev.heading_flat_only()
      dev.set_declination(45)
      h2 = dev.heading_flat_only()
      diff = abs(h2 - h1)
      if diff > 180:
          diff = 360 - diff
      result = 35 < diff < 55
    expect_true: true
    mode: [mock]

  - name: "direction_label returns cardinal"
    action: script
    script: |
      label = dev.direction_label(0)
      result = label == "N"
    expect_true: true
    mode: [mock]

  - name: "direction_label E at 90 degrees"
    action: script
    script: |
      label = dev.direction_label(90)
      result = label == "E"
    expect_true: true
    mode: [mock]

  # ----- read_all -----

  - name: "read_all returns dict with expected keys"
    action: script
    script: |
      data = dev.read_all()
      keys = set(data.keys())
      expected = {"raw", "uT", "cal_norm", "tempC", "status"}
      result = keys == expected
    expect_true: true
    mode: [mock]

  # ----- Mode & configuration setters -----

  - name: "set_mode continuous"
    action: script
    script: |
      dev.set_mode("continuous")
      result = dev.get_mode() == "continuous"
    expect_true: true
    mode: [mock]

  - name: "set_mode idle"
    action: script
    script: |
      dev.set_mode("idle")
      result = dev.get_mode() == "idle"
    expect_true: true
    mode: [mock]

  - name: "set_odr writes CFG_REG_A"
    action: script
    script: |
      i2c.clear_write_log()
      dev.set_odr(50)
      log = i2c.get_write_log()
      result = any(reg == 0x60 for reg, data in log)
    expect_true: true
    mode: [mock]

  - name: "power_on restores continuous mode"
    action: script
    script: |
      dev.power_off()
      dev.power_on()
      result = dev.get_mode() == "continuous"
    expect_true: true
    mode: [mock]

  - name: "is_idle after power_off"
    action: script
    script: |
      dev.power_off()
      result = dev.is_idle()
    expect_true: true
    mode: [mock]

  - name: "data_ready returns True when status has Zyxda set"
    action: script
    script: |
      # Mock STATUS_REG is 0x0F (Zyxda bit set)
      result = dev.data_ready() is True
    expect_true: true
    mode: [mock]

  - name: "magnetic_field_raw returns same as magnetic_field"
    action: script
    script: |
      raw = dev.magnetic_field_raw()
      field = dev.magnetic_field()
      result = raw == field
    expect_true: true
    mode: [mock]

  - name: "heading_from_vectors computes angle"
    action: script
    script: |
      dev.calibrate_reset()
      h = dev.heading_from_vectors(100, 0, 0, calibrated=False)
      result = 0 <= h < 360
    expect_true: true
    mode: [mock]

  - name: "heading_from_vectors is clockwise from north (flat)"
    action: script
    script: |
      dev.calibrate_reset()
      dev.set_heading_offset(0)
      dev.set_declination(0)
      dev.set_heading_filter(0)
      cases = [((0, 1, 0), 0), ((-1, 0, 0), 90), ((0, -1, 0), 180), ((1, 0, 0), 270)]
      ok = True
      for (x, y, z), expected in cases:
          h = dev.heading_from_vectors(x, y, z)
          if abs(h - expected) > 0.01:
              ok = False
      result = ok
    expect_true: true
    mode: [mock]

  - name: "direction_label uses centred sectors"
    action: script
    script: |
      cases = [(350, "N"), (10, "N"), (30, "NE"), (337.4, "NW"), (337.6, "N"),
               (22.4, "N"), (22.6, "NE"), (359.99, "N"), (0, "N"), (90, "E"),
               (180, "S"), (270, "W")]
      result = all(dev.direction_label(a) == e for a, e in cases)
    expect_true: true
    mode: [mock]

  - name: "heading never reaches 360 for a tiny negative angle"
    action: script
    script: |
      dev.calibrate_reset()
      dev.set_heading_offset(0)
      dev.set_declination(0)
      dev.set_heading_filter(0)
      # atan2(-x, y) is a tiny negative angle for x = 1e-30 -> -0.0 -> 360.0 with a plain modulo
      h = dev.heading_from_vectors(1e-30, 1e-4, 0)
      dev.set_heading_offset(-1e-20)
      h2 = dev.heading_from_vectors(0, 1, 0)
      result = 0 <= h < 360 and 0 <= h2 < 360
    expect_true: true
    mode: [mock]

  - name: "Fresh magnitude after power down"
    action: script
    script: |
      dev.power_off()
      mag = dev.magnitude_ut()
      result = 10.0 < mag < 300.0
    expect_true: true
    mode: [hardware]

  - name: "Fresh temperature after power down"
    action: script
    script: |
      dev.power_off()
      t = dev.temperature()
      result = 10.0 < t < 45.0
    expect_true: true
    mode: [hardware]

  # ----- Hardware -----

  - name: "Magnitude in plausible range"
    action: call
    method: magnitude_ut
    expect_range: [10.0, 300.0]
    mode: [hardware]

  - name: "Temperature in plausible range"
    action: call
    method: temperature
    expect_range: [10.0, 45.0]
    mode: [hardware]

  - name: "Soft reset then WHO_AM_I"
    action: hardware_script
    script: |
      dev.soft_reset()
      result = dev.device_id()
    expect: 0x40
    mode: [hardware]

  - name: "Reboot then WHO_AM_I"
    action: hardware_script
    script: |
      dev.reboot()
      result = dev.device_id()
    expect: 0x40
    mode: [hardware]

  - name: "Magnetic field values feel correct"
    action: manual
    display:
      - method: magnitude_ut
        label: "Magnitude"
        unit: "µT"
      - method: temperature
        label: "Temperature"
        unit: "°C"
      - method: heading_flat_only
        label: "Heading"
        unit: "°"
    prompt: "Ces valeurs sont-elles cohérentes (magnitude ~25-65µT, cap 0-360°) ?"
    expect_true: true
    mode: [hardware]
