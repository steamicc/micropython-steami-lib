type: board
name: "steami_screen_v1c"

# Hardware-only checks of the round GC9A01 screen of a STeaMi V1c, drawn
# through steami.Screen (240 x 240, scaling factor k = 2).
# Needs the release firmware, which freezes gc9a01, steami_screen and steami,
# and no copy of these packages at the /flash root (it comes before .frozen
# on sys.path). Each test starts from a fresh interpreter.
# Most tests only check that nothing raises; look at the screen (or film it)
# to check the drawing itself. The Spleen tests also read pixels back and
# print the widget text timings (minimum of 3 runs, in us).
#
# Run with a terminal (hardware_script tests are skipped without one):
#   python -m pytest tests/ -v -k steami_screen_v1c --port /dev/ttyACM0 -s

tests:
  - name: "Screen begins on the GC9A01"
    action: hardware_script
    script: |
      from steami import Screen, Chip
      screen = Screen()
      ok = screen.begin()
      print("chip:", screen.chip(), "size:", screen.width, screen.height)
      result = (
          ok
          and screen.chip() == Chip.GC9A01 == "GC9A01"
          and screen.width == 240
          and screen.height == 240
          and screen.k == 2
          and screen.error() == ""
      )
    expect_true: true
    mode: [hardware]

  - name: "title, value, subtitle and text draw and show"
    action: hardware_script
    script: |
      from steami import Screen
      from steami_screen import GREEN, YELLOW
      screen = Screen()
      screen.begin()
      screen.clear()
      screen.title("TITLE")
      screen.value(42, unit="C", label="Temp", color=GREEN)
      screen.subtitle("first line", "second line")
      screen.text("N", at="N", color=YELLOW)
      screen.text("S", at="S", scale=2)
      screen.show()
      result = screen.chip() == "GC9A01" and screen.width == 240 and screen.error() == ""
    expect_true: true
    mode: [hardware]

  - name: "bar, graph and menu draw and show"
    action: hardware_script
    script: |
      from steami import Screen
      from steami_screen import GREEN
      screen = Screen()
      screen.begin()
      screen.clear()
      screen.title("BAR")
      screen.bar(60, max_val=100, color=GREEN)
      screen.show()
      screen.clear()
      screen.title("GRAPH")
      screen.graph([10, 25, 40, 30, 55, 70, 60, 80, 75, 90], min_val=0, max_val=100)
      screen.show()
      screen.clear()
      screen.menu(["One", "Two", "Three", "Four", "Five", "Six"], selected=2)
      screen.show()
      result = screen.chip() == "GC9A01" and screen.width == 240 and screen.error() == ""
    expect_true: true
    mode: [hardware]

  - name: "gauge draws and shows"
    action: hardware_script
    script: |
      # The 240 px arc is drawn in Python: about 5 to 11 s on the V1c.
      from steami import Screen
      from steami_screen import GREEN
      screen = Screen()
      screen.begin()
      screen.clear()
      screen.gauge(30, min_val=0, max_val=100, color=GREEN)
      screen.title("GAUGE")
      screen.value(30, unit="%")
      screen.show()
      result = screen.chip() == "GC9A01" and screen.width == 240 and screen.error() == ""
    expect_true: true
    mode: [hardware]

  - name: "compass, watch and every face draw and show"
    action: hardware_script
    script: |
      from steami import Screen
      from steami_screen import FACES, YELLOW
      screen = Screen()
      screen.begin()
      screen.clear()
      screen.compass(45)
      screen.show()
      screen.clear()
      screen.watch(10, 8, 30)
      screen.show()
      for name in FACES:
          screen.clear()
          screen.face(name, color=YELLOW)
          screen.face(name, compact=True)
          screen.show()
      result = screen.chip() == "GC9A01" and screen.width == 240 and screen.error() == ""
    expect_true: true
    mode: [hardware]

  - name: "Primitives draw in colour and show"
    action: hardware_script
    script: |
      from steami import Screen
      from steami_screen import BLUE, GREEN, RED, WHITE, YELLOW
      screen = Screen()
      screen.begin()
      screen.clear()
      cx, cy = screen.center
      screen.circle(cx, cy, screen.radius - 1, WHITE)
      screen.circle(cx, cy, 20, (255, 165, 0), fill=True)
      screen.line(0, cy, screen.width - 1, cy, WHITE)
      screen.rect(40, 150, 30, 20, GREEN, fill=True)
      screen.rect(80, 150, 30, 20, RED, fill=True)
      screen.rect(120, 150, 30, 20, BLUE, fill=True)
      screen.rect(160, 150, 30, 20, YELLOW)
      screen.pixel(cx, 30, WHITE)
      screen.text("xy", at=(100, 60))
      screen.show()
      result = (
          screen.radius == 120
          and screen.center == (120, 120)
          and screen.error() == ""
      )
    expect_true: true
    mode: [hardware]

  - name: "show() sends a frame in under 500 ms"
    action: hardware_script
    script: |
      import time
      from steami import Screen
      screen = Screen()
      screen.begin()
      screen.clear()
      screen.title("SHOW")
      screen.show()
      times = []
      for _ in range(5):
          t0 = time.ticks_ms()
          screen.show()
          times.append(time.ticks_diff(time.ticks_ms(), t0))
      print("show() ms:", times)
      result = max(times) < 500
    expect_true: true
    mode: [hardware]

  - name: "Spleen is frozen and blitted read-only"
    action: hardware_script
    script: |
      # A frozen module's __file__ is relative, like a copy imported from the
      # cwd /flash, so it proves nothing: look for a copy instead, and check
      # that the table is read in place from the firmware flash (not copied
      # to the heap, which a frozen bytes object never is).
      import os
      import framebuf
      import uctypes
      from steami_screen import spleen
      def copied(path):
          try:
              return "steami_screen" in os.listdir(path)
          except OSError:
              return False
      no_copy = not copied("/flash") and not copied("/flash/lib")
      data = spleen.F8X16[4]
      addr = uctypes.addressof(data)
      in_flash = 0x08000000 <= addr < 0x08084000
      try:
          framebuf.FrameBuffer(data, 8, 16, framebuf.MONO_HLSB)
          refused = False
      except TypeError:
          refused = True
      # 'A' (code 65, offset 33 * 16) blitted through a 2x1 GS4 palette
      # (0 -> 0, 1 -> 5) with key 0: its 44 set bits become index 5.
      fb = framebuf.FrameBuffer(bytearray(64), 8, 16, framebuf.GS4_HMSB)
      pal = framebuf.FrameBuffer(bytearray([5]), 2, 1, framebuf.GS4_HMSB)
      fb.blit((memoryview(data)[528:544], 8, 16, framebuf.MONO_HLSB), 0, 0, 0, pal)
      lit = 0
      for y in range(16):
          for x in range(8):
              if fb.pixel(x, y) == 5:
                  lit += 1
      print("no copy:", no_copy, "addr:", hex(addr), "refused:", refused, "lit:", lit)
      result = no_copy and in_flash and refused and lit == 44
    expect_true: true
    mode: [hardware]

  - name: "Accents and degree are drawn"
    action: hardware_script
    script: |
      # Reads back the palette indexes of the frame (GRAY 3, WHITE 5).
      from steami import Screen
      from steami_screen import WHITE
      screen = Screen()
      screen.begin()
      raw = screen._d._raw
      screen.clear()
      screen.title("Été")
      # Row 0 of 'É' (its accent) is on the title row 37.
      accent = [x for x in range(108, 116) if raw.pixel(x, 37) == 3]
      screen.clear()
      screen.text("23°C", (10, 150), WHITE, 2)
      # '°' is the third cell (x 42..57): ink at (46, 152), none at (42, 150).
      ring = raw.pixel(46, 152)
      blank = raw.pixel(42, 150)
      screen.show()
      print("accent:", accent, "degree:", ring, blank)
      result = screen.error() == "" and len(accent) > 0 and ring == 5 and blank == 0
    expect_true: true
    mode: [hardware]

  - name: "max_chars and text_height"
    action: hardware_script
    script: |
      from steami import Screen
      screen = Screen()
      screen.begin()
      print("max_chars:", screen.max_chars, "text_height:", screen.text_height(), screen.text_height(2))
      result = screen.max_chars == 30 and screen.text_height() == 16 and screen.text_height(2) == 32
    expect_true: true
    mode: [hardware]

  - name: "Widget text timing"
    action: hardware_script
    script: |
      # Design 8.1: the widget text of programs 01 and 04 (and mockup 03)
      # must draw in under 10 ms each. The whole gauge (arc-bound) and the
      # pixel text are only reported, to compare with the old firmware: this
      # script also runs there (Task 13), hence the _put signature check.
      import gc
      import time
      from steami import Screen
      from steami_screen import GRAY, WHITE
      screen = Screen()
      screen.begin()
      # Warm-up, not timed: the lazy import of the fonts and the first lookups.
      screen.title("x")
      screen.value(1, "x", label="x")
      screen.text("0", (0, 0))
      screen.clear()
      if hasattr(screen, "text_height"):
          def label(t, x):
              # LABEL ink (1), as gauge() draws it at k = 2.
              screen._put(t, x, 169, GRAY, 1, 2, 1, 0, None, 2)
      else:
          def label(t, x):
              # v0.30 signature: no ink argument.
              screen._put(t, x, 169, GRAY, 2, 1, 0, None, 2)
      def best(call):
          low = None
          for _ in range(3):
              screen.clear()
              gc.collect()
              t0 = time.ticks_us()
              call()
              dt = time.ticks_diff(time.ticks_us(), t0)
              if low is None or dt < low:
                  low = dt
          return low
      widgets = (
          ("04_title", lambda: screen.title("Distance")),
          ("04_value", lambda: screen.value(342, "mm")),
          ("04_subtitle", lambda: screen.subtitle("VL53L1X ToF")),
          ("04_label_0", lambda: label("0", 55)),
          ("04_label_500", lambda: label("500", 185)),
          ("01_title", lambda: screen.title("Temperature")),
          ("01_value", lambda: screen.value(23.5, "°C")),
          ("01_subtitle", lambda: screen.subtitle("BME280")),
          ("03_value", lambda: screen.value(23.5, "°C", "W", "TEMP")),
      )
      reported = (
          ("04_gauge", lambda: screen.gauge(342, 0, 500)),
          ("text_x2", lambda: screen.text("ABCDEFGHIJKLMNO", (0, 100), WHITE, 2)),
      )
      ok = True
      for name, call in widgets:
          dt = best(call)
          print(name, dt, "us")
          ok = ok and dt < 10000
      for name, call in reported:
          print(name, best(call), "us")
      result = ok and screen.error() == ""
    expect_true: true
    mode: [hardware]
