name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic.outputs.new-release-version }}
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          HUSKY: "0"
        run: npx semantic-release

  micropython-firmware:
    name: Build and attach MicroPython firmware
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}

      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new-release-version }}

      # Cached by the action; same GCC as the local builds tested on the board.
      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Write release version into the firmware
        run: python3 scripts/write_firmware_version.py "v${{ needs.release.outputs.new-release-version }}"

      - name: Build MicroPython firmware
        run: make -j"$(nproc)" micropython-firmware

      - name: Attach MicroPython firmware to release
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          VERSION="v${{ needs.release.outputs.new-release-version }}"
          BUILD_DIR=".build/micropython-steami/ports/stm32/build-STEAM32_WB55RG"
          cp "${BUILD_DIR}/firmware.hex" "steami-micropython-firmware-${VERSION}.hex"
          cp "${BUILD_DIR}/firmware.bin" "steami-micropython-firmware-${VERSION}.bin"
          gh release upload "$VERSION" \
            "steami-micropython-firmware-${VERSION}.hex" \
            "steami-micropython-firmware-${VERSION}.bin" \
            --clobber

  daplink-firmware:
    name: Build and attach DAPLink firmware
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}

      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new-release-version }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache ninja-build python3-venv

      - name: Clone DAPLink (needed for venv cache key)
        run: make .build/DAPLink

      - name: Cache gcc-arm-none-eabi 10.3-2021.10
        uses: actions/cache@v6
        with:
          path: .build/gcc-arm-none-eabi-10.3-2021.10
          key: gcc-arm-none-eabi-10.3-2021.10-linux-x86_64

      - name: Cache DAPLink Python venv
        uses: actions/cache@v6
        with:
          path: .build/DAPLink/venv
          key: daplink-venv-${{ runner.os }}-${{ hashFiles('.build/DAPLink/requirements.txt') }}

      - name: Build DAPLink firmware
        run: make daplink-firmware

      - name: Attach DAPLink firmware to release
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          VERSION="v${{ needs.release.outputs.new-release-version }}"
          BUILD_DIR=".build/DAPLink/projectfiles/make_gcc_arm/stm32f103xb_steami32_if/build"
          cp "${BUILD_DIR}/stm32f103xb_steami32_if_crc.bin" "steami-daplink-firmware-${VERSION}.bin"
          cp "${BUILD_DIR}/stm32f103xb_steami32_if_crc.hex" "steami-daplink-firmware-${VERSION}.hex"
          gh release upload "$VERSION" \
            "steami-daplink-firmware-${VERSION}.bin" \
            "steami-daplink-firmware-${VERSION}.hex" \
            --clobber

  publish-release:
    name: Publish the draft release
    needs: [release, micropython-firmware, daplink-firmware]
    if: needs.release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}

      # The repository uses immutable releases: assets can only be added while
      # the release is a draft, so the firmware jobs upload first and the
      # release is published last.
      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          gh release edit "v${{ needs.release.outputs.new-release-version }}" \
            --repo "${{ github.repository }}" \
            --draft=false

      - name: Jeton pour les robots en aval
        id: jeton_aval
        continue-on-error: true   # without a token, warn and let the crons take over
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          owner: steamicc
          repositories: wiki_steami          # the target repositories, comma-separated
          permission-actions: write

      - name: Déclencher les robots en aval
        continue-on-error: true   # a failed dispatch never fails the publication
        env:
          GH_TOKEN: ${{ steps.jeton_aval.outputs.token }}
          JETON: ${{ steps.jeton_aval.outcome }}
        run: |
          if [ "$JETON" != success ]; then
            echo "::warning::App token unavailable: the downstream bots will run on their cron."
            exit 0
          fi
          # One target per "<repository> <bot>" string; a failed target does not stop the next ones.
          for cible in "wiki_steami suivre-micropython.yml"; do
            read -r repo workflow <<<"$cible"
            gh workflow run "$workflow" -R "steamicc/$repo" \
              || echo "::warning::Bot $workflow of steamicc/$repo not dispatched: its cron will take over (check the App's Actions write permission and its installation on this repository)."
          done
